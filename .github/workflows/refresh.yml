name: refresh

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC daily = 08:00 UTC+8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: install lei
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lei
          command -v lei
          lei help >/dev/null
          dpkg-query -W -f='${Version}\n' lei

      - name: compute cache epoch
        id: cache-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: restore lei state
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/public-inbox
            ~/.config/lei
            ~/.local/share/lei
          key: ${{ runner.os }}-lei-state-v1-${{ steps.cache-epoch.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-lei-state-v1-
            ${{ runner.os }}-lei-state-v1

      - name: restore linux-full.git
        uses: actions/cache@v5
        with:
          path: linux-full.git
          key: ${{ runner.os }}-linux-full-2026-${{ steps.cache-epoch.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-linux-full-2026-

      - name: run tests
        run: python3 -m unittest discover -s tests -v

      - name: run refresh.sh
        run: ./refresh.sh

      - name: validate generated files
        run: |
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool lore_data.json >/dev/null
          python3 -m json.tool kernel_stats.json >/dev/null
          python3 -m json.tool author_data.json >/dev/null
          git diff --check

      - name: commit and push if changed
        run: |
          git config user.name "assisted-by-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- index.html author_data.json data.json lore_data.json kernel_stats.json; then
            echo "no data changes"
            exit 0
          fi
          git add index.html author_data.json data.json lore_data.json kernel_stats.json
          git commit -m "data: scheduled refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin "HEAD:${GITHUB_REF_NAME}"
